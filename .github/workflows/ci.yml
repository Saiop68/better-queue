name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: build, typecheck & test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Lua scripts
        run: npm run build:lua

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        # The Sentinel suites are excluded here (see vitest.config.ts): they
        # need the redis-server/redis-cli binaries, which this job does not
        # have. They run in the dedicated `sentinel` job below.
        run: npx vitest run
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379


  sentinel:
    name: sentinel & failover
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install redis-server
        # The Sentinel tests start a master, a replica and a sentinel themselves.
        # The service container cannot be used for this: a sentinel probe issues
        # REPLICAOF against its target, which a containerised service does not
        # allow, and the tests need a disposable topology they can kill.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --version

      - name: Run the Sentinel tests
        # The sentinel tests are self-contained: they create and destroy their
        # own topology on fixed local ports.
        run: npx vitest run --config vitest.sentinel.config.ts
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  publish-check:
    name: verify publishable tarball
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: |
          npm run build:lua
          npm run build
          npm pack --dry-run

      - name: Verify the tarball contains the Lua scripts
        # The worker scripts are read at runtime from the published package.
        # If they are missing from the tarball the library breaks on install.
        run: |
          npm pack
          # npm strips the scope from the tarball name, so match on *.tgz
          TARBALL=$(ls -1 *.tgz | head -1)
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep -q 'scripts/dequeue.lua'
          tar -tzf "$TARBALL" | grep -q 'scripts/enqueue.lua'
          tar -tzf "$TARBALL" | grep -q 'scripts/complete.lua'
          echo "Lua scripts present in tarball"

      - name: Upload the tarball as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
